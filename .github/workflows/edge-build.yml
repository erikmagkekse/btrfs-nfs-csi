name: Edge Build

on:
  push:
    branches: [edge]
    paths:
      - "**.go"
      - "**.html"
      - "go.mod"
      - "go.sum"
      - "Containerfile*"
      - "VERSION"

env:
  IMAGE: ghcr.io/erikmagkekse/btrfs-nfs-csi

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          echo "version=$(cat VERSION)-edge" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge
          labels: |
            org.opencontainers.image.title=btrfs-nfs-csi
            org.opencontainers.image.description=Kubernetes CSI driver that turns any btrfs filesystem into a full-featured NFS storage backend with instant snapshots, clones, and quotas
            org.opencontainers.image.url=https://github.com/erikmagkekse/btrfs-nfs-csi
            org.opencontainers.image.source=https://github.com/erikmagkekse/btrfs-nfs-csi
            org.opencontainers.image.documentation=https://github.com/erikmagkekse/btrfs-nfs-csi#readme
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=Erik Groh
            org.opencontainers.image.authors=Erik Groh <me@eriks.life>
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
